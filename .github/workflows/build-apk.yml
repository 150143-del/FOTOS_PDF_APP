name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # APK 1: usa la cámara del navegador integrado.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias y copiar la web a Android
        run: |
          npm install
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FotosPDF-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # APK 2: igual, pero además incluye la cámara nativa de Android (para relojes donde la cámara web no abre).
  build-camara-nativa:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias, plugin de cámara nativa y copiar la web
        run: |
          npm install
          npm install @capacitor-community/camera-preview@7.0.5
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FotosPDF-apk-camara-nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
