<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fotos a PDF</title>
<style>
  :root{
    --bg:#101417; --fg:#eef2f4; --muted:#9aa7ae; --accent:#ffb020; --accent-fg:#1a1200;
    --panel:#1a2024; --line:#2b343a; --danger:#ff5a4f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
  h2{margin:6px 0 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  p{margin:0;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .chip{flex:1;min-width:64px;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--fg);font:inherit;font-weight:600;text-align:center;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  label.t{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .btn{padding:15px 10px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
    background:var(--accent);color:var(--accent-fg);width:100%}
  .btn.alt{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .btn:focus-visible,.chip:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .err{color:var(--danger);min-height:1.4em;white-space:pre-line}
  /* Cámara nativa: el video queda detrás de la página, que debe ser transparente */
  .nativecam,.nativecam body,.nativecam #cap,.nativecam #stage{background:transparent!important}
  .nativecam #v{display:none}
  .back{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid #ffffff55;background:#000a;color:#fff;
    font-size:1.5rem;line-height:1;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center}

  #setup,#done{padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));gap:16px;max-width:480px;margin:0 auto;width:100%;overflow:auto}
  #setup{justify-content:center}
  #resume{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  #resume b{font-size:1.05rem}

  #cap{background:#000}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  #flash.go{opacity:.75;transition:none}
  #hud{position:absolute;left:0;right:0;top:0;z-index:3;padding:max(10px,env(safe-area-inset-top)) 12px 22px;
    display:flex;align-items:flex-start;gap:10px;background:linear-gradient(#000b,#0000);pointer-events:none}
  #hudText{flex:1;min-width:0}
  #l1{font-size:1.2rem;font-weight:800}
  #l2{color:#ffffffcc;font-size:.85rem;font-variant-numeric:tabular-nums}
  #cd{color:var(--accent);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
  #rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);margin-right:8px;animation:p 1s infinite}
  @keyframes p{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){#rec{animation:none}}
  #undo{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:6;pointer-events:auto;border:1px solid #ffffff66;background:#0008;color:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  #undo:disabled{opacity:.4}
  #bar{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);width:0;z-index:3}
  #msg{position:absolute;left:16px;right:16px;bottom:18px;z-index:3;text-align:center;font-weight:600;background:#000c;padding:10px;border-radius:10px;pointer-events:none}
  #pause{position:absolute;inset:0;z-index:2;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;cursor:pointer}
  #pause b{font-size:1.5rem}
  #pause span{color:#ffffffcc}
  #controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));background:#000}
  #controls #gen{grid-column:1/-1}

  #head{display:flex;align-items:center;gap:12px}
  #info{font-weight:700;font-size:1.15rem}
  .sheet{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
  .sheet .r{display:flex;gap:3px}
  .sheet img{flex:1 1 0;min-width:0;height:auto;border-radius:3px;background:var(--panel)}

  /* Iconos de los botones: en el celular se ve el texto, en el reloj solo el icono */
  .ico{display:none}
  .lbl-short{display:none}
  .watch .lbl-long{display:none}
  .watch .lbl-short{display:inline}
  #ring{display:none}
  #hint-watch{display:none}

  /* ================= RELOJ REDONDO =================
     Todo se mide en vmin (1% del lado menor de la pantalla) y se deja libre el borde,
     porque las esquinas de una pantalla redonda no se ven. */
  .watch body{font-size:clamp(11px,5.2vmin,24px)}
  .watch #intro{display:none}
  .watch h1{font-size:6.6vmin;text-align:center}
  .wonly{display:none}
  .watch .wonly{display:block}
  .watch #wnav.wonly{display:flex}
  .watch .vhide{display:none!important}
  /* Menús del reloj: pantallas cortas centradas, sin lista larga. Si algo no cupiera, aún se puede desplazar. */
  .watch #setup,.watch #done{max-width:none;padding:12.5vmin 15vmin;gap:2vmin;justify-content:center;text-align:center;align-items:stretch}
  .watch #wnav{gap:2vmin}
  .watch #wnav .btn{flex:1}
  .watch label.t{font-size:3.3vmin;display:block;text-align:center}
  .watch .row{gap:1.6vmin}
  .watch .chip{min-width:0;min-height:13vmin;padding:2vmin 1vmin;font-size:4.8vmin;border-radius:5vmin;display:flex;align-items:center;justify-content:center}
  .watch .btn{min-height:11.5vmin;padding:2.4vmin 3vmin;font-size:4.6vmin;border-radius:7vmin}
  .watch .err{font-size:3vmin;min-height:0;line-height:1.3}
  .watch #resume{padding:0;border:0;background:none;gap:1.8vmin}
  .watch #resume b{font-size:4.2vmin}
  .watch #thumbs{display:none}
  .watch #head{flex-direction:column;gap:1.2vmin;align-items:center}
  .watch #info{font-size:4.8vmin}
  .watch .back{width:12vmin;height:12vmin;font-size:6vmin}

  /* La captura se dibuja en un cuadrado de 100vmin pegado arriba: si el WebView del reloj es más alto
     que lo visible, los botones de abajo ya no quedan fuera de pantalla. */
  .watch #cap{inset:auto;top:0;left:calc(50% - 50vmin);width:100vmin;height:100vmin;border-radius:50%;overflow:hidden}
  .watch #controls .btn{flex:none;pointer-events:auto}
  .watch #bar{display:none}
  .watch #ring{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
  .watch #ring circle{fill:none;stroke-width:1.8}
  .watch #ringBg{stroke:#ffffff26}
  .watch #ringC{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .watch #hud{flex-direction:column;align-items:center;gap:.6vmin;padding:4.5vmin 0 0;text-align:center;background:linear-gradient(#000c,#0000 80%)}
  .watch #hud .back{margin-bottom:1vmin}
  .watch #hudText{flex:none;width:72vmin}
  .watch #l1{font-size:4.4vmin}
  .watch #l2{font-size:3.2vmin}
  .watch #cd{font-size:3.8vmin}
  .watch #undo{right:auto;left:4vmin;top:50%;transform:translateY(-50%);padding:2vmin 2.6vmin;font-size:3.6vmin;border-radius:5vmin}
  .watch #msg{left:17vmin;right:17vmin;bottom:28vmin;font-size:3.6vmin;padding:2vmin}
  .watch #pause{padding:15vmin 14vmin;gap:1.6vmin}
  .watch #pause b{font-size:6vmin}
  .watch #pause span{font-size:3.8vmin}
  .watch #hint-watch{display:block;font-size:3.2vmin;color:#ffffffaa;margin-top:1.5vmin}
  .watch #controls{position:absolute;left:0;right:0;bottom:8.5vmin;z-index:20;display:flex;justify-content:center;gap:2.2vmin;padding:0;background:none}
  .watch #controls .btn{width:14.5vmin;height:14.5vmin;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.7vmin;grid-column:auto}
  .watch #controls .btn.alt{background:#000c;border:1.5px solid #ffffff99}
  .watch #controls .lbl{display:none}
  .watch #controls .ico{display:block;width:7vmin;height:7vmin}
  .watch #controls #gen .ico{width:auto;height:auto;font-weight:800}
</style>
</head>
<body>

<section id="setup" class="screen on">
  <h1 id="sTitle">Fotos a PDF</h1>
  <p id="intro">Toma fotos solas cada pocos segundos. Las fotos de una hoja se arman en una sola página del PDF.</p>
  <div id="resume" hidden>
    <b id="resInfo"></b>
    <button class="btn" id="resGo" type="button">Continuar sesión</button>
    <button class="btn alt" id="resPdf" type="button">Generar PDF</button>
    <button class="btn alt" id="resDel" type="button">Descartar fotos</button>
  </div>
  <div id="g0">
    <label class="t">Una foto cada</label>
    <div class="row" id="intervals" style="margin-top:8px">
      <button class="chip" data-s="2" aria-pressed="true">2 s</button>
      <button class="chip" data-s="3" aria-pressed="false">3 s</button>
      <button class="chip" data-s="5" aria-pressed="false">5 s</button>
    </div>
  </div>
  <div id="g1">
    <label class="t">Fotos por fila</label>
    <div class="row" id="perrow" style="margin-top:8px">
      <button class="chip" data-n="0" aria-pressed="true">Yo decido</button>
      <button class="chip" data-n="2" aria-pressed="false">2</button>
      <button class="chip" data-n="3" aria-pressed="false">3</button>
      <button class="chip" data-n="4" aria-pressed="false">4</button>
    </div>
  </div>
  <div id="g3">
    <label class="t">Diseño de pantalla</label>
    <div class="row" id="layout" style="margin-top:8px">
      <button class="chip" data-l="auto" aria-pressed="true">Auto</button>
      <button class="chip" data-l="watch" aria-pressed="false">Reloj</button>
      <button class="chip" data-l="phone" aria-pressed="false">Celular</button>
    </div>
  </div>
  <button class="btn" id="start" type="button">Empezar</button>
  <div class="err" id="err" role="alert"></div>
  <button class="btn alt wonly" id="wSettings" type="button">Ajustes</button>
  <button class="btn alt wonly" id="wMore" type="button">Más opciones</button>
  <div id="wnav" class="wonly row"><button class="btn alt" id="wPrev" type="button">&lsaquo; Atrás</button><button class="btn" id="wNext" type="button">Siguiente &rsaquo;</button></div>
  <button class="btn alt wonly" id="wBack" type="button">&lsaquo; Volver</button>
</section>

<section id="cap" class="screen">
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <div id="flash"></div>
    <div id="hud">
      <button class="back" id="back1" type="button" aria-label="Volver al menú">&larr;</button>
      <div id="hudText"><div id="l1"><span id="rec"></span><span id="l1t"></span></div><div id="l2"></div><div id="cd"></div></div>
    </div>
    <button id="undo" type="button" aria-label="Borrar última foto"><span class="lbl-long">Borrar última</span><span class="lbl-short">Borrar</span></button>
    <div id="bar"></div>
    <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ringBg" cx="50" cy="50" r="48.2"/><circle id="ringC" cx="50" cy="50" r="48.2"/></svg>
    <div id="msg" hidden></div>
    <div id="pause" hidden role="button" tabindex="0"><b id="pTitle"></b><span id="pSub"></span><span id="hint-watch">Botones de abajo: fila nueva · hoja lista · PDF</span></div>
  </div>
  <div id="controls">
    <button class="btn alt" id="rowDone" type="button" aria-label="Nueva fila"><span class="lbl">Nueva fila &darr;</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg></button>
    <button class="btn alt" id="sheetDone" type="button" aria-label="Página completada"><span class="lbl">Página completada</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></button>
    <button class="btn" id="gen" type="button" aria-label="Generar PDF"><span class="lbl">Generar PDF</span><span class="ico">PDF</span></button>
  </div>
</section>

<section id="done" class="screen">
  <div id="head">
    <button class="back" id="back2" type="button" aria-label="Volver al menú">&larr;</button>
    <div id="info">Listo</div>
  </div>
  <div id="prog" class="err" style="color:var(--muted)"></div>
  <button class="btn" id="dl" type="button">Descargar PDF</button>
  <button class="btn alt" id="share" type="button" hidden>Compartir PDF</button>
  <button class="btn alt" id="zip" type="button">Fotos sueltas (ZIP)</button>
  <button class="btn alt" id="more" type="button">Seguir tomando fotos</button>
  <button class="btn alt" id="again" type="button">Nueva sesión</button>
  <button class="btn alt wonly" id="wMore2" type="button">Más opciones</button>
  <button class="btn alt wonly" id="wBack2" type="button">&lsaquo; Volver</button>
  <div class="err" id="err2" role="alert"></div>
  <div id="thumbs"></div>
</section>

<script>
// LIB-START
// Reparte las fotos de UNA hoja en una página: cada fila va de izquierda a derecha y las filas bajan.
// rows: lista de filas; cada fila es una lista de fotos {w,h}. Elige página vertical u horizontal (A4) según cuál deja las fotos más grandes.
function layoutSheet(rows){
  const M = 20, LBL = 18, G = 4;
  let best = null;
  [[595, 842], [842, 595]].forEach(([W, H]) => {
    const aw = W - 2 * M, ah = H - 2 * M - LBL;
    const hs = rows.map(r => (aw - G * (r.length - 1)) / r.reduce((a, s) => a + s.w / s.h, 0));
    const f = Math.min(1, (ah - G * (rows.length - 1)) / hs.reduce((a, b) => a + b, 0));
    if (!best || aw * f > best.size + 0.01) best = { W, H, aw, hs, f, size: aw * f };
  });
  const items = []; let y = M + LBL;
  rows.forEach((r, ri) => {
    const rh = best.hs[ri] * best.f;
    const ws = r.map(s => (s.w / s.h) * rh);
    const rowW = ws.reduce((a, b) => a + b, 0) + G * (r.length - 1);
    let x = M + (best.aw - rowW) / 2;
    r.forEach((s, i) => { items.push({ shot: s, x: x, y: y, dw: ws[i], dh: rh }); x += ws[i] + G; });
    y += rh + G;
  });
  return { W: best.W, H: best.H, items: items };
}

// PDF sin librerías: una página por hoja; las fotos van como JPEG tal cual.
// pages: [{W,H,label,items:[{shot:{bytes,w,h},x,y,dw,dh}]}] con x,y desde la esquina superior izquierda.
function buildPdf(pages){
  const enc = new TextEncoder();
  const parts = []; const off = []; let pos = 0;
  const push = (u8) => { parts.push(u8); pos += u8.length; };
  const str = (s) => push(enc.encode(s));
  const esc = (s) => String(s).replace(/[^\x20-\x7E]/g, "?").replace(/([\\()])/g, "\\$1");
  let next = 4;
  const meta = pages.map(p => { const imgIds = p.items.map(() => next++); const co = next++; const po = next++; return { imgIds, co, po }; });
  const total = next - 1;
  str("%PDF-1.4\n");
  off[1] = pos; str("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  off[2] = pos; str("2 0 obj\n<< /Type /Pages /Kids [" + meta.map(m => m.po + " 0 R").join(" ") + "] /Count " + pages.length + " >>\nendobj\n");
  off[3] = pos; str("3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n");
  pages.forEach((p, i) => {
    const m = meta[i];
    p.items.forEach((it, j) => {
      const id = m.imgIds[j]; off[id] = pos;
      str(id + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + it.shot.w + " /Height " + it.shot.h +
          " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + it.shot.bytes.length + " >>\nstream\n");
      push(it.shot.bytes); str("\nendstream\nendobj\n");
    });
    let c = "BT /F1 10 Tf 20 " + (p.H - 32).toFixed(2) + " Td (" + esc(p.label) + ") Tj ET\n";
    p.items.forEach((it, j) => {
      c += "q " + it.dw.toFixed(2) + " 0 0 " + it.dh.toFixed(2) + " " + it.x.toFixed(2) + " " + (p.H - it.y - it.dh).toFixed(2) + " cm /Im" + j + " Do Q\n";
    });
    off[m.co] = pos; str(m.co + " 0 obj\n<< /Length " + c.length + " >>\nstream\n" + c + "endstream\nendobj\n");
    const xo = p.items.map((_, j) => "/Im" + j + " " + m.imgIds[j] + " 0 R").join(" ");
    off[m.po] = pos;
    str(m.po + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + p.W + " " + p.H +
        "] /Resources << /Font << /F1 3 0 R >> /XObject << " + xo + " >> >> /Contents " + m.co + " 0 R >>\nendobj\n");
  });
  const xref = pos;
  let x = "xref\n0 " + (total + 1) + "\n0000000000 65535 f \n";
  for (let i = 1; i <= total; i++) x += String(off[i]).padStart(10, "0") + " 00000 n \n";
  x += "trailer\n<< /Size " + (total + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
  str(x);
  return new Blob(parts, { type: "application/pdf" });
}

function crc32(u8){
  if (!crc32.t){
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    crc32.t = t;
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = crc32.t[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// ZIP sin compresión (los JPEG ya vienen comprimidos).
function buildZip(files){
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.bytes);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + size;
  });
  let cdSize = 0; central.forEach(p => cdSize += p.length);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
}
// LIB-END

(function(){
  const $ = (id) => document.getElementById(id);
  const screens = { setup: $("setup"), cap: $("cap"), done: $("done") };
  const pad = (n) => String(n).padStart(2, "0");
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

  let seconds = 2, perRow = 0;
  const facing = "environment";   // cámara nativa predeterminada del reloj
  let stream = null, nativeCam = false, nbusy = false, runId = 0, wake = null, msgTimer = null, cdTimer = null, nextAt = 0;
  let shots = [];              // {sheet,row,w,h,bytes,url,dead}
  let sheet = 1, row = 0, paused = true;
  let encodeQueue = Promise.resolve();
  let pdfBlob = null, renderId = 0;
  let confirmStart = false, confirmDel = false, confirmNew = false;
  let isWatch = false, layoutPref = "auto", sv = "main", dv = "main";
  const RING = 2 * Math.PI * 48.2;
  const CP = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CameraPreview) || null;
  const hasNative = () => !!CP();

  const STEPS = () => ["g0", "g1", "g3"];

  // ---- Diseño: reloj redondo o celular ----
  try { layoutPref = localStorage.getItem("fotospdf-layout") || "auto"; } catch (e) {}
  try { const q = new URLSearchParams(location.search).get("reloj"); if (q === "1") layoutPref = "watch"; if (q === "0") layoutPref = "phone"; } catch (e) {}
  function applyLayout(){
    const w = window.innerWidth, h = window.innerHeight;
    const auto = Math.abs(w / h - 1) < 0.15 && Math.max(w, h) <= 640;   // pantalla casi cuadrada y chica
    isWatch = layoutPref === "watch" || (layoutPref === "auto" && auto);
    document.documentElement.classList.toggle("watch", isWatch);
    [...$("layout").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.l === layoutPref ? "true" : "false"));
    renderSetup(); renderDone();
  }
  // En el reloj los menús son páginas cortas: así no hace falta desplazarse para llegar a "Empezar".
  function renderSetup(){
    const n = shots.length, vis = new Set();
    if (sv === "main") (n ? ["resume", "resInfo", "resGo", "resPdf", "wMore"] : ["start", "wSettings"]).forEach(x => vis.add(x));
    else if (sv === "more") ["resume", "resDel", "start", "wSettings", "wBack"].forEach(x => vis.add(x));
    else { vis.add(sv); vis.add("wnav"); }
    ["resume", "resInfo", "resGo", "resPdf", "resDel", "g0", "g1", "g3", "start", "wSettings", "wMore", "wnav", "wBack"]
      .forEach(id => $(id).classList.toggle("vhide", isWatch && !vis.has(id)));
    const st = STEPS(), i = st.indexOf(sv);
    $("sTitle").textContent = !isWatch || sv === "main" ? "Fotos a PDF" : sv === "more" ? "Más opciones" : "Ajustes " + (i + 1) + "/" + st.length;
    $("sTitle").classList.toggle("vhide", isWatch && sv === "more");
    $("wNext").innerHTML = i === st.length - 1 ? "Listo" : "Siguiente &rsaquo;";
  }
  function renderDone(){
    const vis = new Set(dv === "main" ? ["head", "prog", "dl", "share", "more", "wMore2"] : ["prog", "zip", "again", "wBack2"]);
    ["head", "prog", "dl", "share", "zip", "more", "again", "wMore2", "wBack2"]
      .forEach(id => $(id).classList.toggle("vhide", isWatch && !vis.has(id)));
  }
  $("layout").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    layoutPref = b.dataset.l;
    try { localStorage.setItem("fotospdf-layout", layoutPref); } catch (er) {}
    applyLayout();
  });
  window.addEventListener("resize", applyLayout);
  applyLayout();

  const show = (k) => { for (const s in screens) screens[s].classList.toggle("on", s === k); };
  function pushScreen(){ if (!(history.state && history.state.s === "in")) history.pushState({ s: "in" }, ""); }

  function pick(groupId, attr, cb){
    $(groupId).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      [...$(groupId).children].forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
      cb(b.dataset[attr]);
    });
  }
  pick("intervals", "s", v => seconds = +v);
  pick("perrow", "n", v => perRow = +v);

  const count = (f) => shots.filter(f).length;
  function hud(){
    const nRow = count(s => s.sheet === sheet && s.row === row), nSheet = count(s => s.sheet === sheet);
    $("l1t").textContent = "Hoja " + sheet + " · Fila " + (row + 1);
    $("l2").textContent = "Fila: " + nRow + " · Hoja: " + nSheet + " · Total: " + shots.length;
    $("undo").disabled = nSheet === 0;
    $("rec").style.display = paused ? "none" : "inline-block";
    if (paused) $("cd").textContent = "En pausa";
  }
  function say(t){
    const m = $("msg"); m.textContent = t; m.hidden = false;
    clearTimeout(msgTimer); msgTimer = setTimeout(() => m.hidden = true, 2200);
  }
  function setPause(title, sub){
    paused = true; stopTimers();
    $("pTitle").textContent = title; $("pSub").textContent = sub; $("pause").hidden = false; hud();
  }

  // ---- Reloj de captura: sigue la hora real, así que guardar la foto no retrasa la siguiente ----
  function runBar(ms){
    const b = $("bar"); b.style.transition = "none"; b.style.width = "0";
    const r = $("ringC"); r.style.strokeDasharray = RING; r.style.transition = "none"; r.style.strokeDashoffset = RING;
    void b.offsetWidth; void r.getBoundingClientRect();
    b.style.transition = "width " + ms + "ms linear"; b.style.width = "100%";
    r.style.transition = "stroke-dashoffset " + ms + "ms linear"; r.style.strokeDashoffset = 0;
  }
  function stopTimers(){
    runId++; clearInterval(cdTimer); cdTimer = null;
    const b = $("bar"); b.style.transition = "none"; b.style.width = "0";
    const r = $("ringC"); r.style.strokeDasharray = RING; r.style.transition = "none"; r.style.strokeDashoffset = RING;
  }
  function tick(id){
    const d = Math.max(0, nextAt - performance.now());
    setTimeout(() => {
      if (id !== runId) return;
      capture();
      nextAt += seconds * 1000;
      const now = performance.now();
      if (nextAt < now + 200) nextAt = now + seconds * 1000; // si el celular se atrasó, no acumular
      runBar(nextAt - now);
      tick(id);
    }, d);
  }
  function startLoop(){
    stopTimers(); paused = false; $("pause").hidden = true;
    const id = runId, first = 1200; // un momento para que la cámara enfoque
    nextAt = performance.now() + first; hud(); runBar(first);
    cdTimer = setInterval(() => {
      const s = Math.max(0, Math.ceil((nextAt - performance.now()) / 1000));
      $("cd").textContent = (isWatch ? "Foto en " : "Próxima foto en ") + s + " s";
    }, 200);
    tick(id);
  }

  async function captureNative(){
    if (nbusy) return;                        // si la foto anterior aún no vuelve, se salta este disparo
    nbusy = true;
    const mySheet = sheet, myRow = row;
    try {
      const r = await CP().captureSample({ quality: 85 });
      if (!nativeCam) return;
      const bin = atob(String(r.value).replace(/^data:[^,]*,/, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
      const dim = await new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([0, 0]); im.src = url; });
      if (!dim[0]){ URL.revokeObjectURL(url); say("No se pudo leer la foto"); return; }
      shots.push({ sheet: mySheet, row: myRow, w: dim[0], h: dim[1], bytes: bytes, url: url, dead: false });
      if (perRow > 0 && sheet === mySheet && row === myRow && count(s => s.sheet === mySheet && s.row === myRow) >= perRow) row++;
      hud();
      const f = $("flash"); f.classList.add("go");
      requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove("go")));
    } catch (e) { say("La cámara no respondió"); }
    finally { nbusy = false; }
  }
  function capture(){
    if (nativeCam){ captureNative(); return; }
    const v = $("v");
    if (!v.videoWidth || v.readyState < 2){ say("La cámara todavía no entrega imagen"); return; }
    const k = Math.min(1, (isWatch ? 1600 : 1800) / Math.max(v.videoWidth, v.videoHeight));
    const W = Math.round(v.videoWidth * k), H = Math.round(v.videoHeight * k);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    c.getContext("2d").drawImage(v, 0, 0, W, H);          // instantáneo: aquí se toma la foto
    const shot = { sheet: sheet, row: row, w: W, h: H, bytes: null, url: null, dead: false };
    shots.push(shot);
    if (perRow > 0 && count(s => s.sheet === sheet && s.row === row) >= perRow) row++;
    hud();
    const f = $("flash"); f.classList.add("go");
    requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove("go")));
    encodeQueue = encodeQueue.then(() => encode(shot, c)).catch(() => {}); // el JPEG se guarda en segundo plano
  }
  async function encode(shot, c){
    try {
      if (shot.dead) return;
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
      if (!blob || shot.dead) return;
      shot.bytes = new Uint8Array(await blob.arrayBuffer());
      shot.url = URL.createObjectURL(blob);
    } finally { c.width = c.height = 0; }
  }

  // Abre la cámara por dos vías: la del navegador integrado (web) y, si el APK la incluye, la nativa de Android.
  function withTimeout(p, ms){
    return new Promise((res, rej) => {
      let done = false;
      const t = setTimeout(() => { done = true; const e = new Error("tiempo agotado"); e.name = "Timeout"; rej(e); }, ms);
      p.then(v => { if (done){ try { v.getTracks().forEach(x => x.stop()); } catch (e) {} } else { clearTimeout(t); res(v); } },
             e => { if (!done){ clearTimeout(t); rej(e); } });
    });
  }
  async function openWeb(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e = new Error("sin acceso a la cámara web"); e.name = "SinApi"; throw e; }
    const gum = (c) => withTimeout(navigator.mediaDevices.getUserMedia(c), 8000);
    const W = isWatch ? 1280 : 1920, H = isWatch ? 720 : 1080;
    const tries = [
      { video: { facingMode: { ideal: facing }, width: { ideal: W }, height: { ideal: H } }, audio: false },
      { video: { facingMode: facing }, audio: false },
      { video: true, audio: false }
    ];
    let last = null, s = null;
    for (const c of tries){
      try { s = await gum(c); break; } catch (e) { last = e; if (e && (e.name === "NotAllowedError" || e.name === "Timeout")) break; }
    }
    if (!s){ // probar cada cámara por separado
      try {
        const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput" && d.deviceId);
        for (const d of devs){ try { s = await gum({ video: { deviceId: { exact: d.deviceId } }, audio: false }); break; } catch (e) { last = e; } }
      } catch (e) {}
    }
    if (!s) throw last || new Error("sin cámara");
    stream = s;
    try { // enfoque continuo, si se puede
      const t = s.getVideoTracks()[0], caps = t.getCapabilities ? t.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes("continuous")) await t.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
    } catch (e) {}
    const v = $("v"); v.srcObject = s; await v.play().catch(() => {});
    for (let i = 0; i < 30 && !v.videoWidth; i++) await new Promise(r => setTimeout(r, 100));
    if (!v.videoWidth){ s.getTracks().forEach(t => t.stop()); stream = null; const e = new Error("la cámara abrió pero no entrega imagen"); e.name = "SinImagen"; throw e; }
  }
  async function openNative(){
    const cp = CP();
    if (!cp){ const e = new Error("este APK no la incluye"); e.name = "NoIncluida"; throw e; }
    const pos = facing === "user" ? "front" : "rear", alt = pos === "rear" ? "front" : "rear";
    let last = null;
    for (const p of [pos, alt]){
      try {
        await cp.start({ position: p, toBack: true, disableAudio: true, enableZoom: false, lockAndroidOrientation: false, storeToFile: false });
        nativeCam = true; document.documentElement.classList.add("nativecam");
        return;
      } catch (e) { last = e; }
    }
    throw last || new Error("no abrió");
  }
  const errText = (e) => !e ? "" : typeof e === "string" ? e.slice(0, 60) : ((e.name && e.name !== "Error" ? e.name + " " : "") + (e.message || "")).trim().slice(0, 60);
  async function explain(we, ne){
    let perm = "?", n = "?";
    try { perm = (await navigator.permissions.query({ name: "camera" })).state; } catch (e) {}
    try { n = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput").length; } catch (e) {}
    const m = /Chrome\/(\d+)/.exec(navigator.userAgent);
    let first = "No se pudo abrir la cámara.";
    if (we && we.name === "NotAllowedError" && perm !== "prompt") first = "Falta el permiso de cámara. Actívalo en Ajustes del reloj → Apps → Fotos a PDF → Permisos.";
    else if (we && we.name === "NotReadableError") first = "La cámara está ocupada por otra app. Ciérrala y prueba otra vez.";
    else if (!hasNative()) first = "No se pudo abrir la cámara del reloj. Revisa el permiso de cámara.";
    return first + "\nWeb: " + (errText(we) || "no se probó") + "\nNativa: " + (hasNative() ? (errText(ne) || "no se probó") : "no incluida") +
           "\nPermiso: " + perm + " · Cámaras: " + n + " · WebView " + (m ? m[1] : "?");
  }
  async function openCamera(){
    let we = null, ne = null;
    const order = ["native", "web"];
    for (const eng of order){
      try {
        if (eng === "web") await openWeb(); else await openNative();
        try { wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; }
        return "";
      } catch (e) { if (eng === "web") we = e; else ne = e; }
    }
    return await explain(we, ne);
  }
  function closeCamera(){
    stopTimers();
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (nativeCam){
      nativeCam = false; document.documentElement.classList.remove("nativecam");
      try { Promise.resolve(CP().stop()).catch(() => {}); } catch (e) {}
    }
    if (wake){ try { wake.release(); } catch (e) {} wake = null; }
  }
  function clearShots(){
    shots.forEach(s => { s.dead = true; if (s.url) URL.revokeObjectURL(s.url); });
    shots = []; sheet = 1; row = 0;
  }

  // ---- Menú ----
  function refreshMenu(){
    const n = shots.length, hojas = new Set(shots.map(s => s.sheet)).size;
    confirmStart = confirmDel = false;
    $("resume").hidden = n === 0;
    $("resInfo").textContent = isWatch
      ? n + (n === 1 ? " foto" : " fotos") + " · " + hojas + (hojas === 1 ? " hoja" : " hojas")
      : "Sesión guardada: " + n + (n === 1 ? " foto" : " fotos") + " en " + hojas + (hojas === 1 ? " hoja" : " hojas");
    if (n === 0 && sv === "more") sv = "main";
    renderSetup();
    $("start").textContent = n ? (isWatch ? "Empezar de nuevo" : "Empezar de nuevo (borra las fotos)") : "Empezar";
    $("resDel").textContent = "Descartar fotos";
  }
  function goMenu(){
    closeCamera(); paused = true; renderId++; $("pause").hidden = true;
    sv = "main"; show("setup"); refreshMenu();
  }
  const back = () => { if (history.state && history.state.s === "in") history.back(); else goMenu(); };
  window.addEventListener("popstate", goMenu);
  $("back1").addEventListener("click", back);
  $("back2").addEventListener("click", back);

  async function start(){
    if (shots.length && !confirmStart){ confirmStart = true; $("start").textContent = isWatch ? "¿Seguro? Toca otra vez" : "¿Seguro? Se borran las fotos. Toca otra vez"; return; }
    $("err").textContent = "";
    const e = await openCamera();
    if (e){ $("err").textContent = e; return; }
    clearShots(); show("cap"); pushScreen(); startLoop();
  }
  async function continueSession(){
    const target = $("setup").classList.contains("on") ? $("err") : $("err2");
    target.textContent = "";
    const e = await openCamera();
    if (e){ target.textContent = e; return; }
    renderId++; show("cap"); pushScreen();
    setPause("Cámara lista", "Toca la pantalla para continuar en la hoja " + sheet);
  }

  function rowDone(){
    if (count(s => s.sheet === sheet && s.row === row) === 0){ say("Esta fila todavía no tiene fotos"); return; }
    row++; hud(); say("Fila " + (row + 1) + ": ahora baja la cámara");
  }
  function sheetDone(){
    if (count(s => s.sheet === sheet) === 0){ say("Esta hoja todavía no tiene fotos"); return; }
    const done = sheet; sheet++; row = 0;
    setPause("Hoja " + done + " completada", "Toca la pantalla para empezar la hoja " + sheet);
  }
  function undo(){
    for (let i = shots.length - 1; i >= 0; i--){
      if (shots[i].sheet === sheet){
        const s = shots[i]; s.dead = true; if (s.url) URL.revokeObjectURL(s.url);
        shots.splice(i, 1);
        if (count(x => x.sheet === sheet && x.row === row) === 0 && s.row < row) row = s.row;
        break;
      }
    }
    hud();
  }

  // ---- Resultado ----
  function grouped(){
    const m = new Map();
    shots.filter(s => s.bytes).forEach(s => {
      if (!m.has(s.sheet)) m.set(s.sheet, new Map());
      const r = m.get(s.sheet); if (!r.has(s.row)) r.set(s.row, []); r.get(s.row).push(s);
    });
    return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([sh, rows]) =>
      ({ sheet: sh, rows: [...rows.entries()].sort((a, b) => a[0] - b[0]).map(e => e[1]) }));
  }
  function nameFor(ext){
    const d = new Date();
    return "fotos-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + "." + ext;
  }
  async function generate(){
    if (shots.length === 0){ say("Todavía no hay fotos"); return; }
    closeCamera(); paused = true; dv = "main"; renderDone(); show("done"); pushScreen(); confirmNew = false; $("again").textContent = "Nueva sesión";
    const id = ++renderId;
    $("err2").textContent = ""; $("prog").textContent = "Guardando las últimas fotos…"; pdfBlob = null;
    ["dl", "share", "zip"].forEach(k => $(k).disabled = true);
    await encodeQueue;
    if (id !== renderId) return;
    $("prog").textContent = "";
    const groups = grouped(), n = groups.reduce((a, g) => a + g.rows.reduce((b, r) => b + r.length, 0), 0);
    if (!n){ $("info").textContent = "No se pudo guardar ninguna foto"; return; }
    $("info").textContent = n + (n === 1 ? " foto" : " fotos") + " en " + groups.length + (groups.length === 1 ? " hoja" : " hojas");
    const t = $("thumbs"); t.innerHTML = "";
    groups.forEach(g => {
      const nf = g.rows.reduce((a, r) => a + r.length, 0);
      const h = document.createElement("h2"); h.textContent = "Hoja " + g.sheet + " · " + nf + (nf === 1 ? " foto" : " fotos") + " en " + g.rows.length + (g.rows.length === 1 ? " fila" : " filas"); t.appendChild(h);
      const box = document.createElement("div"); box.className = "sheet";
      g.rows.forEach(r => {
        const rd = document.createElement("div"); rd.className = "r";
        r.forEach(s => { const i = new Image(); i.src = s.url; i.alt = "Hoja " + g.sheet; i.style.flexGrow = (s.w / s.h).toFixed(3); rd.appendChild(i); });
        box.appendChild(rd);
      });
      t.appendChild(box);
    });
    try {
      const pages = groups.map(g => {
        const nf = g.rows.reduce((a, r) => a + r.length, 0);
        const L = layoutSheet(g.rows);
        return { W: L.W, H: L.H, items: L.items, label: "Hoja " + g.sheet + " - " + nf + (nf === 1 ? " foto" : " fotos") + " en " + g.rows.length + (g.rows.length === 1 ? " fila" : " filas") };
      });
      pdfBlob = buildPdf(pages);
    } catch (e) { $("err2").textContent = "No se pudo armar el PDF."; pdfBlob = null; }
    ["dl", "zip"].forEach(k => $(k).disabled = false);
    const f = fileObj();
    $("share").hidden = native || !(navigator.canShare && f && navigator.canShare({ files: [f] }));
    $("share").disabled = false;
    $("dl").textContent = native ? "Guardar o enviar PDF" : "Descargar PDF";
  }
  function fileObj(){
    try { return pdfBlob ? new File([pdfBlob], nameFor("pdf"), { type: "application/pdf" }) : null; } catch (e) { return null; }
  }
  function save(url, name){
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  // En la app instalada (APK) no hay descargas del navegador: se guarda el archivo y se abre el menú de Android.
  function blobToBase64(blob){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1]);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }
  async function nativeSave(blob, name){
    const P = window.Capacitor.Plugins;
    const data = await blobToBase64(blob);
    let canShare = true;
    try { const c = await P.Share.canShare(); canShare = !!(c && c.value); } catch (e) {}
    if (canShare){
      try {
        const w = await P.Filesystem.writeFile({ path: name, data: data, directory: "CACHE" });
        await P.Share.share({ title: name, dialogTitle: "Guardar o enviar", files: [w.uri] });
        return;
      } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return; }
    }
    // Sin menú de compartir (pasa en algunos relojes): se guarda en la memoria de la app.
    await P.Filesystem.writeFile({ path: name, data: data, directory: "EXTERNAL", recursive: true });
    $("prog").textContent = "Guardado en la memoria: Android/data/com.mar.fotospdf/files/" + name;
  }
  async function deliver(blob, name){
    $("err2").textContent = "";
    try {
      if (native) await nativeSave(blob, name);
      else { const u = URL.createObjectURL(blob); save(u, name); setTimeout(() => URL.revokeObjectURL(u), 60000); }
    } catch (e) {
      const m = String((e && e.message) || e);
      if (!/cancel/i.test(m)) $("err2").textContent = "No se pudo guardar el archivo. " + m;
    }
  }

  $("start").addEventListener("click", start);
  $("rowDone").addEventListener("click", rowDone);
  $("sheetDone").addEventListener("click", sheetDone);
  $("gen").addEventListener("click", generate);
  $("undo").addEventListener("click", undo);
  const resume = () => { if (paused && camOn()) startLoop(); };
  $("pause").addEventListener("click", resume);
  $("pause").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") resume(); });

  $("wSettings").addEventListener("click", () => { sv = STEPS()[0]; renderSetup(); });
  $("wMore").addEventListener("click", () => { sv = "more"; renderSetup(); });
  $("wBack").addEventListener("click", () => { sv = "main"; renderSetup(); });
  $("wPrev").addEventListener("click", () => { const st = STEPS(), i = st.indexOf(sv); sv = i <= 0 ? "main" : st[i - 1]; renderSetup(); });
  $("wNext").addEventListener("click", () => { const st = STEPS(), i = st.indexOf(sv); sv = i >= st.length - 1 ? "main" : st[i + 1]; renderSetup(); });
  $("wMore2").addEventListener("click", () => { dv = "more"; renderDone(); });
  $("wBack2").addEventListener("click", () => { dv = "main"; renderDone(); });
  $("resGo").addEventListener("click", continueSession);
  $("resPdf").addEventListener("click", generate);
  $("resDel").addEventListener("click", () => {
    if (!confirmDel){ confirmDel = true; $("resDel").textContent = isWatch ? "¿Seguro? Toca otra vez" : "¿Seguro? Toca otra vez para borrar"; return; }
    clearShots(); refreshMenu();
  });
  $("dl").addEventListener("click", () => { if (pdfBlob) deliver(pdfBlob, nameFor("pdf")); });
  $("share").addEventListener("click", async () => {
    const f = fileObj(); if (!f) return;
    try { await navigator.share({ files: [f], title: "Fotos" }); } catch (e) {}
  });
  $("zip").addEventListener("click", () => {
    const files = [];
    grouped().forEach(g => g.rows.forEach((r, ri) => r.forEach((s, i) =>
      files.push({ name: "hoja" + pad(g.sheet) + "-fila" + pad(ri + 1) + "-foto" + pad(i + 1) + ".jpg", bytes: s.bytes }))));
    deliver(buildZip(files), nameFor("zip"));
  });
  $("more").addEventListener("click", continueSession);
  $("again").addEventListener("click", () => {
    if (!confirmNew){ confirmNew = true; $("again").textContent = isWatch ? "¿Seguro? Toca otra vez" : "¿Seguro? Se borran todas las fotos. Toca otra vez"; return; }
    clearShots(); back();
  });

  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && camOn() && !wake){ try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
  });
  if (!native && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  hud(); refreshMenu();
})();
</script>
</body>
</html>
